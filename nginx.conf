server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # TLS terminates at Cloudflare, so nginx only ever sees port 80 and has
    # to be told how the client actually arrived. Redirect only when the edge
    # says plain HTTP: a request with no X-Forwarded-Proto is not from the
    # edge at all - the container healthcheck hits http://127.0.0.1:80/ - and
    # must not be sent to an https:// address with no listener behind it.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Also at server level, for the two responses no location produces: the
    # X-Forwarded-Proto redirect above and the trailing-slash rewrite below
    # both answer in the rewrite phase, before a location is ever selected.
    # nginx resumes inheriting add_header into any block that declares none of
    # its own, and every location here declares its own set, so this copy
    # reaches exactly those two responses and is ignored everywhere else.
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
    gzip_min_length 256;

    # SvelteKit hashed assets - cache indefinitely
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Umami analytics proxy (same-origin avoids ORB/CORS/ad-blocker issues)
    # Docker embedded DNS; resolve at request time so nginx starts without umami
    resolver 127.0.0.11 valid=30s;
    set $umami http://umami:3000;

    location = /insights.js {
        proxy_pass $umami/script.js;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/security-headers.conf;
    }

    location = /api/send {
        proxy_pass $umami/api/send;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/security-headers.conf;
    }

    # Umami API proxy for dashboard analytics (same auth as /variants)
    location /api/umami/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        include /etc/nginx/umami_auth.conf;
        rewrite ^/api/umami/(.*) /api/$1 break;
        proxy_pass $umami;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/security-headers.conf;
    }

    # Strip trailing slashes (except root) - SvelteKit generates .html files, not index.html
    rewrite ^(.+)/$ $1 permanent;

    # Sub-variant dashboard - HTTP Basic auth
    location = /variants {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
    }

    # Mechanical room readout - a plain static file docker-entrypoint.sh's
    # background loop rewrites every five minutes. no-store so Cloudflare's
    # edge does not hold a reading past its next poll; if the poller never
    # ran (HA_* unset), this 404s and the landing page's sample values
    # stand.
    location = /api/basement/metrics {
        try_files /api/basement/metrics.json =404;
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
    }

    # The last 24 hours behind the readout's sparklines, rewritten by the
    # same loop on the same cycle. Same rules as the metrics file above; a
    # 404 here just means no sparklines.
    location = /api/basement/history {
        try_files /api/basement/history.json =404;
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
    }

    # All other routes - prerendered HTML pages
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/security-headers.conf;
    }
}
