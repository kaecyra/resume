# Security headers, included by every location block in nginx.conf, and once
# at server level for the redirect responses no location produces (#239).
#
# The repetition is nginx's rule, not a style choice: add_header directives
# are inherited from an outer block only while the inner block declares no
# add_header of its own. Several locations here set their own Cache-Control,
# which would silently drop every server-level security header - that is how
# `location = /variants` came to serve no X-Frame-Options at all. Including
# this file in each location keeps them together and makes the omission
# obvious when the next location is added.
#
# `always` so the headers are present on error responses too, including the
# =404 that try_files falls through to.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# TLS terminates at Cloudflare, so this header travels back out over the
# edge's HTTPS connection even though nginx itself speaks plain HTTP.
# No `preload`: the directive is reversible by lowering max-age and waiting
# out what browsers have cached, and submitting to the preload list is not.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# $csp_script_hashes comes from conf.d/csp-map.conf, generated at build time
# by scripts/generate-csp.ts: the sha256 of the page's own inline SvelteKit
# hydration script, or empty for anything with no inline script.
#
# style-src needs 'unsafe-inline' twice over - the built pages carry inline
# <style> elements, and the landing components set style= attributes - and
# needs fonts.googleapis.com because app.css reaches it through an @import.
# font-src covers the faces that stylesheet then pulls from fonts.gstatic.com.
# img-src needs data: for the SVG noise texture in src/routes/+page.svelte.
# Every runtime fetch() is same-origin, Umami included, since /insights.js
# and /api/send are proxied through this server rather than called directly.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' $csp_script_hashes; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'; upgrade-insecure-requests" always;
