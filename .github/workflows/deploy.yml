name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Nightly, so the contribution grid and the globe's satellite
    # elements refresh without a code change.
    # This re-pushes the same VERSION tag alongside `latest`; Watchtower
    # tracks `latest`, so the repeat tag is harmless.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build-and-push:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Read version
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Writes data/generated/github.json into the checkout before the
      # Docker build context is captured (the Dockerfile's `COPY . .` picks
      # it up). continue-on-error so a fetch failure (bad token, GitHub API
      # outage) never blocks a deploy - the page just renders its offline
      # state for that build instead, same as a contributor building
      # locally without GH_CONTRIB_PAT.
      - name: Fetch GitHub contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GH_CONTRIB_PAT }}
        run: npm run fetch-github
        continue-on-error: true

      # Writes static/landing/satellites.json from CelesTrak (no key needed).
      # continue-on-error for the same reason as the GitHub fetch: a
      # CelesTrak outage ships a globe without satellites, never a failed
      # deploy.
      - name: Fetch satellite orbital elements
        run: npm run fetch-satellites
        continue-on-error: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_BASE_URL=${{ vars.PUBLIC_BASE_URL }}
            PUBLIC_UMAMI_WEBSITE_ID=${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
