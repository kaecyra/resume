name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Base-branch filter. `feature/*` lets a stacked PR into an
    # integration branch run the same gate as a PR into main.
    branches:
      - main
      - "feature/*"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx svelte-kit sync
      - run: npm run check
      - run: npm test
      - run: npm run build
