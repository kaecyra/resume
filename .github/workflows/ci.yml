name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Base-branch filter. `feature/*` only: stacking PRs onto an
    # integration branch is a feature-work pattern. Fixes, hotfixes,
    # releases and docs branches go straight to main, so they need no
    # entry here. Widen this if a non-feature stack ever appears.
    branches:
      - main
      - "feature/*"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx svelte-kit sync
      - run: npm run check
      - run: npm test
      - run: npm run build
