hero:
  name: "Tim Gunter"
  role: "VP Engineering, .Monks"
  location: "Montreal, QC"
  tagline: |
    I build systems, and lately I build them by directing AI agents instead of typing
    every line myself.
  tagline_emphasis: "directing AI agents"

projects:
  - id: odette
    name: "Odette"
    blurb: |
      A sandbox for running AI coding agents without handing them your credentials or
      the open internet. Network egress runs through a host-side proxy, shell commands
      go through a separate execution daemon, and every project gets its own mount and
      volume isolation with configurable approval gates (Manual, Judge, Yolo). Skills
      and agent guidance move between projects as shared files instead of being
      copy-pasted into each one.
    stack:
      - "Go"
      - "Docker"
    status: "Not yet public"

  - id: resume-engine
    name: "Resume Engine"
    blurb: |
      This resume site itself: a schema-driven deployment platform where content lives
      in YAML and every theme, PDF export, and variant reads from the same source.
      Built almost entirely by directing AI agents rather than hand-typing it, as a
      live demonstration of Chat-Oriented Programming (CHOP). It's also the test case
      for how well that workflow holds up under real constraints.
    repo_url: "https://github.com/kaecyra/resume"
    stack:
      - "SvelteKit"
      - "TypeScript"
      - "Tailwind CSS"
    status: "Active"

  - id: penny-royal
    name: "Penny Royal"
    blurb: |
      A multi-tenant AI agent framework that runs on your own hardware. A local model
      triages every inbound message and handles what it can on-device; only complex
      reasoning escalates to a provider you choose, and that boundary is explicit.
      Credentials are encrypted per tenant and injected at execution time, so the model
      never sees a secret. Integrations are MCP servers, so the core never needs to
      know what is behind one.
    links:
      - label: "Site"
        url: "https://pennyroyal.io"
    stack:
      - "TypeScript"
      - "Bun"
      - "PostgreSQL"
      - "MCP"
    status: "In development"

appearances:
  - id: gtc-2026
    event: "NVIDIA GTC 2026"
    what: "LiveVision talk"
    date: "March 2026"
    blurb: |
      Talked at NVIDIA GTC 2026 about the architecture behind LiveVision: real-time AI
      video understanding at the edge, running high-concurrency model inference against
      a live broadcast feed, and generating new assets fast enough to keep up with it.

  - id: ces-2026
    event: "CES 2026"
    what: "LiveVision demo"
    date: "January 2026"
    blurb: |
      Built and ran a live, on-prem computer vision pipeline at CES 2026: real video
      feeds from an NFL game, processed on DGX Spark and Lenovo Neo hardware. Getting
      inference to keep pace with the live feed, on hardware that had to work
      correctly the first time on the show floor, was the hard part.

